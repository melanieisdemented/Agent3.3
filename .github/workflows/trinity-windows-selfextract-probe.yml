name: TRINITY Windows selfextract probe
on:
  push:
    branches: [trinity-r4-ci-20260901]
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Run embedded XZ selfextractor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $b64=''
          $f=Join-Path $env:RUNNER_TEMP 'TRINITY_SELFEXTRACT_PROBE.cmd'
          [IO.File]::WriteAllBytes($f,[Convert]::FromBase64String($b64))
          & cmd.exe /d /c $f
          if($LASTEXITCODE -ne 0){throw "selfextractor failed $LASTEXITCODE"}
          Write-Host 'WINDOWS_SELFEXTRACT_XZ_PASS'
