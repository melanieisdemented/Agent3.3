name: TRINITY R3 installer proof

on:
  push:
    branches: [trinity-r3-ci-20260901]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Build exact installer fixture
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'r3src'
          New-Item -ItemType Directory -Force (Join-Path $src 'CORE')|Out-Null
          foreach($d in @('CONFIG','APPS','POLICY','COMPONENTS','TOOLS','ADDONS','UPDATES')){New-Item -ItemType Directory -Force (Join-Path $src $d)|Out-Null;'fixture'|Set-Content (Join-Path $src $d 'fixture.txt')}
          [IO.File]::WriteAllBytes((Join-Path $src 'CORE\install_windows.ps1'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $src 'START_TRINITY.cmd'),[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $src 'INSTALL_TRINITY.cmd'),[Convert]::FromBase64String('QGVjaG8gb2ZmCnNldGxvY2FsCnBvd2Vyc2hlbGwuZXhlIC1Ob1Byb2ZpbGUgLUV4ZWN1dGlvblBvbGljeSBCeXBhc3MgLUZpbGUgIiV+ZHAwQ09SRVxpbnN0YWxsX3dpbmRvd3MucHMxIgpleGl0IC9iICVlcnJvcmxldmVsJQo='))
          [IO.File]::WriteAllBytes((Join-Path $src 'CORE\edualc_captain_windows.ps1'),[Convert]::FromBase64String(''))
      - name: Install twice and prove Windows behavior
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'r3src'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $src 'CORE\install_windows.ps1')
          if($LASTEXITCODE -ne 0){throw 'first install failed'}
          $roots=@((Join-Path $env:ProgramData 'TRINITY\universal'),(Join-Path $env:LOCALAPPDATA 'TRINITY\universal'))
          $dest=$roots|Where-Object{Test-Path (Join-Path $_ 'STATE\install\current.json')}|Select-Object -First 1
          if(!$dest){throw 'destination not found'}
          $j=Get-Content -Raw (Join-Path $dest 'STATE\install\current.json')|ConvertFrom-Json
          if(!(Test-Path $j.desktop_launcher)){throw "desktop launcher missing: $($j.desktop_launcher)"}
          'PERSIST_ME'|Set-Content (Join-Path $dest 'STATE\ci_marker.txt')
          Start-Sleep -Seconds 2
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $src 'CORE\install_windows.ps1')
          if((Get-Content -Raw (Join-Path $dest 'STATE\ci_marker.txt')).Trim() -ne 'PERSIST_ME'){throw 'state marker lost'}
          $j=Get-Content -Raw (Join-Path $dest 'STATE\install\current.json')|ConvertFrom-Json
          foreach($d in @('CORE','CONFIG','APPS','POLICY','COMPONENTS','TOOLS','ADDONS','UPDATES')){if(!(Test-Path (Join-Path $j.backup_root $d))){throw "backup missing $d"}}
          if(!(Test-Path $j.desktop_launcher)){throw 'desktop launcher missing after reinstall'}
          Write-Host WINDOWS_R3_INSTALLER_PASS

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Build exact installer fixture
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/r3src"
          mkdir -p "$SRC/CORE"
          for d in CONFIG APPS POLICY COMPONENTS TOOLS ADDONS UPDATES; do mkdir -p "$SRC/$d"; echo fixture > "$SRC/$d/fixture.txt"; done
          echo ''|base64 -d > "$SRC/CORE/install_linux.sh"
          echo ''|base64 -d > "$SRC/START_TRINITY.sh"
          echo 'IyEvYmluL3NoCnNldCAtZXUKSEVSRT0kKENEUEFUSD0gY2QgLS0gIiQoZGlybmFtZSAtLSAiJDAiKSIgJiYgcHdkKQpleGVjIHNoICIkSEVSRS9DT1JFL2luc3RhbGxfbGludXguc2giCg=='|base64 -d > "$SRC/INSTALL_TRINITY.sh"
          echo ''|base64 -d > "$SRC/CORE/edualc_captain.py"
          chmod +x "$SRC/CORE/install_linux.sh" "$SRC/START_TRINITY.sh" "$SRC/INSTALL_TRINITY.sh"
      - name: Install twice and prove Ubuntu behavior
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/r3src"
          export TRINITY_HOME="$RUNNER_TEMP/trinity-home"
          sh "$SRC/CORE/install_linux.sh"
          test -f "$TRINITY_HOME/STATE/hardware/current.json"
          echo PERSIST_ME > "$TRINITY_HOME/STATE/ci_marker.txt"
          DESKTOP=$(python3 -c 'import json,os; print(json.load(open(os.environ["TRINITY_HOME"]+"/STATE/install/current.json"))["desktop_launcher"])')
          test -f "$DESKTOP"
          sleep 2
          sh "$SRC/CORE/install_linux.sh"
          grep -qx PERSIST_ME "$TRINITY_HOME/STATE/ci_marker.txt"
          BACKUP=$(python3 -c 'import json,os; print(json.load(open(os.environ["TRINITY_HOME"]+"/STATE/install/current.json"))["backup_root"])')
          for d in CORE CONFIG APPS POLICY COMPONENTS TOOLS ADDONS UPDATES; do test -d "$BACKUP/$d"; done
          DESKTOP=$(python3 -c 'import json,os; print(json.load(open(os.environ["TRINITY_HOME"]+"/STATE/install/current.json"))["desktop_launcher"])')
          test -f "$DESKTOP"
          echo UBUNTU_R3_INSTALLER_PASS
