name: TRINITY R4 Windows real offline EDUALC

on:
  push:
    branches: [trinity-r3-ci-20260901]
  workflow_dispatch:

jobs:
  windows-r4-llm:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Run exact R4 Windows local-LLM launcher with real payload
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'trinity-r4-real'
          $core=Join-Path $root 'CORE'
          $pay=Join-Path $root 'COMPONENTS\EDUALC_OFFLINE_MINIMUM'
          New-Item -ItemType Directory -Force $core,(Join-Path $pay 'MODELS\LOW'),(Join-Path $pay 'RUNTIMES\LLAMA\WINDOWS_X64_CPU')|Out-Null
          [IO.File]::WriteAllBytes((Join-Path $core 'start_edualc_llm_windows.ps1'),[Convert]::FromBase64String(''))
          $model=Join-Path $pay 'MODELS\LOW\Qwen3.5-0.8B-Q4_0.gguf'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true' -OutFile $model
          $zip=Join-Path $env:RUNNER_TEMP 'llama-win.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-x64.zip' -OutFile $zip
          Expand-Archive -Force $zip (Join-Path $pay 'RUNTIMES\LLAMA\WINDOWS_X64_CPU')
          $h=(Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant()
          if($h -ne '57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf'){throw "model hash mismatch $h"}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $core 'start_edualc_llm_windows.ps1') -Root $root
          if($LASTEXITCODE -ne 0){throw "launcher failed $LASTEXITCODE"}
          $state=Get-Content -Raw (Join-Path $root 'STATE\edualc_llm\current.json')|ConvertFrom-Json
          if($state.status -ne 'ONLINE'){throw "bad state $($state.status)"}
          $body=@{model='captain';messages=@(@{role='system';content='Return exactly WINDOWS_R4_REAL_EDUALC_PASS and nothing else.'},@{role='user';content='Respond now.'});temperature=0;max_tokens=40}|ConvertTo-Json -Depth 5
          $resp=Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($state.port)/v1/chat/completions" -ContentType 'application/json' -Body $body -TimeoutSec 90
          $text=[string]$resp.choices[0].message.content
          if($text -notmatch 'WINDOWS_R4_REAL_EDUALC_PASS'){throw "bad inference: $text"}
          Write-Host WINDOWS_R4_REAL_EDUALC_PASS
