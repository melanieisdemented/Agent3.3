name: TRINITY R4 Windows direct EDUALC smoke

on:
  push:
    branches: [trinity-r4-ci-20260901]
    paths:
      - '.github/workflows/trinity-r4-windows-llama-smoke.yml'
  workflow_dispatch:

jobs:
  windows-llama:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Fetch and verify model/runtime
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'direct-edualc';New-Item -ItemType Directory -Force $root|Out-Null
          $model=Join-Path $root 'Qwen3.5-0.8B-Q4_0.gguf'
          & curl.exe -fL --retry 4 --retry-delay 2 -o $model 'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true'
          if($LASTEXITCODE -ne 0){throw 'model download failed'}
          $sha=[System.Security.Cryptography.SHA256]::Create();$s=[IO.File]::OpenRead($model);try{$h=$sha.ComputeHash($s)}finally{$s.Dispose();$sha.Dispose()};$mh=([BitConverter]::ToString($h)).Replace('-','').ToLowerInvariant()
          if($mh -ne '57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf'){throw "model hash mismatch $mh"}
          $zip=Join-Path $root 'llama.zip'
          & curl.exe -fL --retry 4 --retry-delay 2 -o $zip 'https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-x64.zip'
          if($LASTEXITCODE -ne 0){throw 'runtime download failed'}
          $sha=[System.Security.Cryptography.SHA256]::Create();$s=[IO.File]::OpenRead($zip);try{$h=$sha.ComputeHash($s)}finally{$s.Dispose();$sha.Dispose()};$zh=([BitConverter]::ToString($h)).Replace('-','').ToLowerInvariant()
          if($zh -ne '0e8b65e650e369f70f8307d890508886f171ef4fb00facccddd4a1b7ffdaca51'){throw "runtime hash mismatch $zh"}
          $bin=Join-Path $root 'bin';Expand-Archive -Force $zip $bin
          $server=Get-ChildItem $bin -Filter llama-server.exe -File -Recurse|Select-Object -First 1
          if(!$server){throw 'llama-server.exe missing'}
          "EDUALC_ROOT=$root"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "EDUALC_MODEL=$model"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "EDUALC_SERVER=$($server.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "DIRECT_PAYLOAD_PASS model=$mh runtime=$zh server=$($server.FullName)"

      - name: Direct health and real inference in same process scope
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:EDUALC_ROOT 'stdout.log';$err=Join-Path $env:EDUALC_ROOT 'stderr.log'
          $args=@('-m',$env:EDUALC_MODEL,'--alias','captain','--host','127.0.0.1','--port','18090','--ctx-size','4096','--jinja','--reasoning','off','-ngl','0')
          $p=Start-Process -FilePath $env:EDUALC_SERVER -ArgumentList $args -WorkingDirectory (Split-Path $env:EDUALC_SERVER -Parent) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $ok=$false
          for($i=0;$i -lt 240;$i++){
            Start-Sleep -Milliseconds 500
            if($p.HasExited){Get-Content $err -ErrorAction SilentlyContinue|Out-Host;throw "llama-server exited $($p.ExitCode)"}
            try{$r=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18090/health' -TimeoutSec 2;if($r.StatusCode -eq 200){$ok=$true;break}}catch{}
          }
          if(!$ok){Get-Content $err -ErrorAction SilentlyContinue|Out-Host;throw 'health timeout'}
          Write-Host "DIRECT_HEALTH_PASS pid=$($p.Id)"
          $body=@{model='captain';messages=@(@{role='user';content='Reply with exactly EDUALC_WINDOWS_DIRECT_PASS and nothing else.'});temperature=0;max_tokens=32}|ConvertTo-Json -Depth 6
          $r=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18090/v1/chat/completions' -ContentType 'application/json' -Body $body -TimeoutSec 180
          $content=[string]$r.choices[0].message.content
          if($content.Trim() -ne 'EDUALC_WINDOWS_DIRECT_PASS'){throw "unexpected content: $content"}
          Write-Host 'EDUALC_WINDOWS_DIRECT_PASS'
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
