name: TRINITY R4 Windows installer plumbing proof

on:
  push:
    branches: [trinity-r4-ci-20260901]
    paths:
      - '.github/workflows/trinity-r4-windows-installer-plumbing.yml'
      - 'ci_r4_src/CORE/install_windows.ps1'
      - 'ci_r4_src/INSTALL_TRINITY.cmd'
      - 'ci_r4_src/START_TRINITY.cmd'
  workflow_dispatch:

jobs:
  plumbing:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact installer post-starter plumbing
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'plumbsrc';New-Item -ItemType Directory -Force $src|Out-Null
          Copy-Item -Force "$env:GITHUB_WORKSPACE\ci_r4_src\INSTALL_TRINITY.cmd" $src
          Copy-Item -Force "$env:GITHUB_WORKSPACE\ci_r4_src\START_TRINITY.cmd" $src
          New-Item -ItemType Directory -Force (Join-Path $src 'CORE')|Out-Null
          Copy-Item -Force "$env:GITHUB_WORKSPACE\ci_r4_src\CORE\install_windows.ps1" (Join-Path $src 'CORE')
          foreach($d in @('CONFIG','APPS','POLICY','COMPONENTS','TOOLS','ADDONS','UPDATES','EDUALC')){New-Item -ItemType Directory -Force (Join-Path $src $d)|Out-Null;'fixture'|Set-Content -Encoding ASCII (Join-Path $src "$d\fixture.txt")}
          @'
          param([string]$Root,[switch]$Once)
          New-Item -ItemType Directory -Force (Join-Path $Root 'STATE\ci-captain')|Out-Null
          Write-Host 'PLUMB_CAPTAIN_PASS'
          '@|Set-Content -Encoding UTF8 (Join-Path $src 'CORE\edualc_captain_windows.ps1')
          @'
          param([string]$Root)
          New-Item -ItemType Directory -Force (Join-Path $Root 'STATE\edualc')|Out-Null
          '{"owned_process":true,"reused_existing":false,"pid":1,"port":8090}'|Set-Content -Encoding UTF8 (Join-Path $Root 'STATE\edualc\runtime.json')
          Write-Host 'PLUMB_STARTER_PASS'
          '@|Set-Content -Encoding UTF8 (Join-Path $src 'CORE\start_local_edualc_windows.ps1')
          @'param([string]$Root)
          '@|Set-Content -Encoding UTF8 (Join-Path $src 'CORE\stop_local_edualc_windows.ps1')
          if(Test-Path 'D:\TRINITY\universal'){Remove-Item -Recurse -Force 'D:\TRINITY\universal'}
          & cmd.exe /c (Join-Path $src 'INSTALL_TRINITY.cmd');if($LASTEXITCODE -ne 0){throw "install exit $LASTEXITCODE"}
          $dest='D:\TRINITY\universal';$j=Get-Content -Raw (Join-Path $dest 'STATE\install\current.json')|ConvertFrom-Json
          if($j.captain_autostart -ne 'startup_folder' -or $j.local_edualc_autostart -ne 'startup_folder'){throw 'autostart state wrong'}
          if(!(Test-Path $j.desktop_launcher)){throw 'desktop shortcut absent'}
          $startup=[Environment]::GetFolderPath('Startup')
          if(!(Test-Path (Join-Path $startup 'TRINITY_EDUALC_CAPTAIN.cmd'))){throw 'captain Startup launcher absent'}
          if(!(Test-Path (Join-Path $startup 'TRINITY_LOCAL_EDUALC.cmd'))){throw 'local EDUALC Startup launcher absent'}
          Write-Host "WINDOWS_INSTALLER_PLUMBING_PASS dest=$dest desktop=$($j.desktop_launcher) startup=$startup"
