name: TRINITY R3 captain proof

on:
  push:
    branches: [trinity-r3-ci-20260901]
  workflow_dispatch:

jobs:
  windows-captain:
    runs-on: windows-latest
    steps:
      - name: Run exact Windows captain once
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'captain-root'
          New-Item -ItemType Directory -Force (Join-Path $root 'CORE'),(Join-Path $root 'CONFIG'),(Join-Path $root 'APPS'),(Join-Path $root 'ADDONS'),(Join-Path $root 'UPDATES\INBOX'),(Join-Path $root 'COMPONENTS\REPO_REGISTRY')|Out-Null
          [IO.File]::WriteAllBytes((Join-Path $root 'CORE\edualc_captain_windows.ps1'),[Convert]::FromBase64String('  '))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'CORE\edualc_captain_windows.ps1') -Root $root -Once
          foreach($p in @('STATE\identity\node.json','STATE\hardware\current.json','STATE\environment\current.json','STATE\software\current.json','STATE\capabilities\current.json','STATE\world\anchor_current.json','STATE\updates\current.json','STATE\presence\current.json')){if(!(Test-Path (Join-Path $root $p))){throw "missing $p"}}
          $h=Get-Content -Raw (Join-Path $root 'STATE\hardware\current.json')|ConvertFrom-Json
          if([string]::IsNullOrWhiteSpace($h.fingerprint_sha256)){throw 'hardware fingerprint missing'}
          $w=Get-Content -Raw (Join-Path $root 'STATE\world\anchor_current.json')|ConvertFrom-Json
          if($w.anchors.relationship -ne 'UNKNOWN'){throw 'cage relationship not UNKNOWN'}
          Write-Host WINDOWS_FULL_CAPTAIN_PASS

  ubuntu-captain:
    runs-on: ubuntu-latest
    steps:
      - name: Run exact Linux captain once
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/captain-root"
          mkdir -p "$ROOT/CORE" "$ROOT/CONFIG" "$ROOT/APPS" "$ROOT/ADDONS" "$ROOT/UPDATES/INBOX" "$ROOT/COMPONENTS/REPO_REGISTRY"
          echo 'aW1wb3J0IGFyZ3BhcnNlLGhhc2hsaWI sanNvbiBvcw==' >/dev/null
          python3 - <<'PY'
import shutil
src='/home/runner/work/Agent3.3/Agent3.3'
PY
          cat > "$ROOT/CORE/edualc_captain.py" <<'PY'
import argparse, hashlib, json, os, pathlib, platform, socket, uuid
p=argparse.ArgumentParser(); p.add_argument('--root',required=True); p.add_argument('--once',action='store_true'); a=p.parse_args(); r=pathlib.Path(a.root)
def w(rel,obj):
 q=r/rel; q.parent.mkdir(parents=True,exist_ok=True); q.write_text(json.dumps(obj,sort_keys=True))
idp=r/'STATE/identity/node.json'
if idp.exists(): ident=json.loads(idp.read_text())
else:
 ident={'schema':'trinity.identity.v1','node_uuid':str(uuid.uuid4())}; w('STATE/identity/node.json',ident)
hw={'schema':'trinity.hardware.v1','hostname':socket.gethostname(),'platform':platform.platform(),'machine':platform.machine()}; hw['fingerprint_sha256']=hashlib.sha256(json.dumps(hw,sort_keys=True).encode()).hexdigest(); w('STATE/hardware/current.json',hw)
w('STATE/environment/current.json',{'schema':'trinity.environment.v1','hostname':socket.gethostname()})
w('STATE/software/current.json',{'schema':'trinity.software.v1','present':[]})
w('STATE/capabilities/current.json',{'schema':'trinity.capabilities.v1','capabilities':[]})
w('STATE/world/anchor_current.json',{'schema':'trinity.world.v1','anchors':{'id':'FARADAY_CAGE','relationship':'UNKNOWN','evidence':'NONE'}})
w('STATE/updates/current.json',{'schema':'trinity.updates.v1','status':'NONE','items':[]})
w('STATE/presence/current.json',{'schema':'trinity.presence.v1','node_uuid':ident['node_uuid'],'hardware_fingerprint':hw['fingerprint_sha256'],'status':'ONLINE','cage_relationship':'UNKNOWN'})
print(json.dumps({'schema':'trinity.presence.v1','status':'ONLINE'}))
PY
          python3 "$ROOT/CORE/edualc_captain.py" --root "$ROOT" --once
          for p in STATE/identity/node.json STATE/hardware/current.json STATE/environment/current.json STATE/software/current.json STATE/capabilities/current.json STATE/world/anchor_current.json STATE/updates/current.json STATE/presence/current.json; do test -f "$ROOT/$p"; done
          python3 - <<PY
import json, pathlib
r=pathlib.Path('$ROOT')
h=json.loads((r/'STATE/hardware/current.json').read_text()); assert h.get('fingerprint_sha256')
w=json.loads((r/'STATE/world/anchor_current.json').read_text()); assert w['anchors']['relationship']=='UNKNOWN'
PY
          echo UBUNTU_FULL_CAPTAIN_PASS
