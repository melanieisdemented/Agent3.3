name: TRINITY EDUALC Windows ARM64 runtime fetch

on:
  push:
    branches: [trinity-r3-ci-20260901]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and verify Windows ARM64 llama runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/RUNTIMES/LLAMA/WINDOWS_ARM64_CPU
          curl -fL --retry 4 --retry-delay 3 -o /tmp/warm.zip 'https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-arm64.zip'
          echo 'c072e8bb057751587243c1e0ed28d82e23c7e0544a426e0d476f1e77792bf3ce  /tmp/warm.zip' | sha256sum -c -
          unzip -q /tmp/warm.zip -d out/RUNTIMES/LLAMA/WINDOWS_ARM64_CPU
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          echo WINDOWS_ARM64_RUNTIME_FETCH_VERIFY_PASS
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: trinity-edualc-windows-arm64-runtime
          path: out
          compression-level: 0
          retention-days: 7
