name: TRINITY EDUALC payload split

on:
  push:
    branches: [trinity-r3-ci-20260901]
  workflow_dispatch:

jobs:
  split-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch verify and split model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/model out/runtimes payload/MODELS/LOW payload/RUNTIMES/LLAMA/WINDOWS_X64_CPU payload/RUNTIMES/LLAMA/LINUX_X64_CPU payload/RUNTIMES/LLAMA/LINUX_ARM64_CPU
          MODEL=payload/MODELS/LOW/Qwen3.5-0.8B-Q4_0.gguf
          curl -fL --retry 4 --retry-delay 3 -o "$MODEL" 'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true'
          echo '57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf  payload/MODELS/LOW/Qwen3.5-0.8B-Q4_0.gguf' | sha256sum -c -
          stat -c '%s' "$MODEL" > out/model/original_size.txt
          echo '57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf' > out/model/original_sha256.txt
          split -b 240000000 -d -a 2 "$MODEL" out/model/model.part-
          sha256sum out/model/model.part-* > out/model/PART_SHA256SUMS.txt
          test -f out/model/model.part-00 && test -f out/model/model.part-01 && test -f out/model/model.part-02
          curl -fL --retry 4 --retry-delay 3 -o /tmp/w.zip 'https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-x64.zip'
          echo '0e8b65e650e369f70f8307d890508886f171ef4fb00facccddd4a1b7ffdaca51  /tmp/w.zip' | sha256sum -c -
          unzip -q /tmp/w.zip -d payload/RUNTIMES/LLAMA/WINDOWS_X64_CPU
          curl -fL --retry 4 --retry-delay 3 -o /tmp/lx.tar.gz 'https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-ubuntu-x64.tar.gz'
          echo '91d7b03ddae498a39f28fdb85d84d2b4a0fd3838d10b4f897e0ef8975bb9b583  /tmp/lx.tar.gz' | sha256sum -c -
          tar -xzf /tmp/lx.tar.gz -C payload/RUNTIMES/LLAMA/LINUX_X64_CPU
          curl -fL --retry 4 --retry-delay 3 -o /tmp/la.tar.gz 'https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-ubuntu-arm64.tar.gz'
          echo '95940151be63492f70f659da420b268244cc83a6ee70e310d2600ccdb7ea4deb  /tmp/la.tar.gz' | sha256sum -c -
          tar -xzf /tmp/la.tar.gz -C payload/RUNTIMES/LLAMA/LINUX_ARM64_CPU
          tar -czf out/runtimes/llama-runtimes.tar.gz -C payload RUNTIMES
          sha256sum out/runtimes/llama-runtimes.tar.gz > out/runtimes/SHA256SUMS.txt
          du -h out/model/model.part-* out/runtimes/llama-runtimes.tar.gz
          echo EDUALC_PAYLOAD_SPLIT_PASS
      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: trinity-edualc-model-part-00
          path: |
            out/model/model.part-00
            out/model/original_size.txt
            out/model/original_sha256.txt
            out/model/PART_SHA256SUMS.txt
          compression-level: 0
          retention-days: 7
      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: trinity-edualc-model-part-01
          path: out/model/model.part-01
          compression-level: 0
          retention-days: 7
      - name: Upload model part 02
        uses: actions/upload-artifact@v4
        with:
          name: trinity-edualc-model-part-02
          path: out/model/model.part-02
          compression-level: 0
          retention-days: 7
      - name: Upload runtimes
        uses: actions/upload-artifact@v4
        with:
          name: trinity-edualc-llama-runtimes
          path: out/runtimes
          compression-level: 0
          retention-days: 7
