name: TRINITY R4 Windows lifecycle native proof

on:
  push:
    branches: [trinity-r4-ci-20260901]
    paths:
      - '.github/workflows/trinity-r4-windows-step-proof.yml'
      - 'ci_r4_src/**'
  workflow_dispatch:

jobs:
  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare exact R4 source and verified payload
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'r4src'
          New-Item -ItemType Directory -Force $src|Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\ci_r4_src\*" $src
          foreach($d in @('CONFIG','APPS','POLICY','COMPONENTS','TOOLS','ADDONS','UPDATES')) {
            $p=Join-Path $src $d; New-Item -ItemType Directory -Force $p|Out-Null
            'fixture'|Set-Content -Encoding ASCII (Join-Path $p 'fixture.txt')
          }
          @'
          param([string]$Root,[switch]$Once)
          New-Item -ItemType Directory -Force (Join-Path $Root 'STATE\ci-captain')|Out-Null
          '{"schema":"ci.captain","status":"LIVE"}'|Set-Content -Encoding UTF8 (Join-Path $Root 'STATE\ci-captain\current.json')
          Write-Host 'CI_CAPTAIN_PASS'
          '@ | Set-Content -Encoding UTF8 (Join-Path $src 'CORE\edualc_captain_windows.ps1')
          $modelDir=Join-Path $src 'EDUALC\MODELS\LOW';$runtimeDir=Join-Path $src 'EDUALC\RUNTIMES\LLAMA\WINDOWS_X64_CPU'
          New-Item -ItemType Directory -Force $modelDir,$runtimeDir|Out-Null
          $model=Join-Path $modelDir 'Qwen3.5-0.8B-Q4_0.gguf'
          & curl.exe -fL --retry 4 --retry-delay 2 -o $model 'https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf?download=true';if($LASTEXITCODE -ne 0){throw 'model download failed'}
          $sha=[Security.Cryptography.SHA256]::Create();$s=[IO.File]::OpenRead($model);try{$h=$sha.ComputeHash($s)}finally{$s.Dispose();$sha.Dispose()};$mh=([BitConverter]::ToString($h)).Replace('-','').ToLowerInvariant();if($mh -ne '57d1997790d1744fba5b40a7317df71ea5e2acee28c47e78f0cce39c0703f8cf'){throw "model hash $mh"}
          $zip=Join-Path $env:RUNNER_TEMP 'llama-win.zip';& curl.exe -fL --retry 4 --retry-delay 2 -o $zip 'https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-x64.zip';if($LASTEXITCODE -ne 0){throw 'runtime download failed'}
          $sha=[Security.Cryptography.SHA256]::Create();$s=[IO.File]::OpenRead($zip);try{$h=$sha.ComputeHash($s)}finally{$s.Dispose();$sha.Dispose()};$zh=([BitConverter]::ToString($h)).Replace('-','').ToLowerInvariant();if($zh -ne '0e8b65e650e369f70f8307d890508886f171ef4fb00facccddd4a1b7ffdaca51'){throw "runtime hash $zh"}
          Expand-Archive -Force $zip $runtimeDir
          "R4SRC=$src"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PAYLOAD_PREP_PASS model=$mh runtime=$zh"

      - name: Install infer start reinstall infer final proof
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=$env:R4SRC;$dest='D:\TRINITY\universal'
          if(Test-Path $dest){Remove-Item -Recurse -Force $dest}
          Write-Host 'PHASE_FIRST_INSTALL_BEGIN'
          & cmd.exe /c (Join-Path $src 'INSTALL_TRINITY.cmd');if($LASTEXITCODE -ne 0){throw "first install failed $LASTEXITCODE"}
          $j1=Get-Content -Raw (Join-Path $dest 'STATE\install\current.json')|ConvertFrom-Json
          $r1=Get-Content -Raw (Join-Path $dest 'STATE\edualc\runtime.json')|ConvertFrom-Json
          if(!$r1.owned_process -or $r1.reused_existing){throw 'first install did not own EDUALC'}
          $pid1=[int]$r1.pid
          if(!(Test-Path $j1.desktop_launcher)){throw 'desktop launcher missing after first install'}
          if($j1.captain_autostart -ne 'startup_folder' -or $j1.local_edualc_autostart -ne 'startup_folder'){throw 'Startup-folder autostart not recorded'}
          Write-Host "FIRST_INSTALL_PASS pid=$pid1 desktop=$($j1.desktop_launcher)"
          python (Join-Path $dest 'CORE\verify_local_edualc.py') --root $dest;if($LASTEXITCODE -ne 0){throw 'first inference failed'}
          Write-Host 'FIRST_INFERENCE_PASS'

          Write-Host 'PHASE_START_BEGIN'
          $installedAt=$j1.installed_at
          & cmd.exe /c (Join-Path $dest 'START_TRINITY.cmd');if($LASTEXITCODE -ne 0){throw 'START TRINITY failed'}
          $jStart=Get-Content -Raw (Join-Path $dest 'STATE\install\current.json')|ConvertFrom-Json
          $rStart=Get-Content -Raw (Join-Path $dest 'STATE\edualc\runtime.json')|ConvertFrom-Json
          if($jStart.installed_at -ne $installedAt){throw 'START TRINITY reran installer'}
          if(!$rStart.owned_process -or $rStart.reused_existing -or [int]$rStart.pid -ne $pid1){throw 'START lost owned-process identity'}
          Write-Host "START_REUSE_PASS pid=$($rStart.pid)"

          'PERSIST_ME'|Set-Content -Encoding ASCII (Join-Path $dest 'STATE\ci_marker.txt')
          Start-Sleep -Seconds 2
          Write-Host 'PHASE_REINSTALL_BEGIN'
          & cmd.exe /c (Join-Path $src 'INSTALL_TRINITY.cmd');if($LASTEXITCODE -ne 0){throw 'second install failed'}
          if((Get-Content -Raw (Join-Path $dest 'STATE\ci_marker.txt')).Trim() -ne 'PERSIST_ME'){throw 'STATE marker lost'}
          $j2=Get-Content -Raw (Join-Path $dest 'STATE\install\current.json')|ConvertFrom-Json
          $r2=Get-Content -Raw (Join-Path $dest 'STATE\edualc\runtime.json')|ConvertFrom-Json
          if(!$r2.owned_process -or $r2.reused_existing){throw 'ownership lost after reinstall'}
          if([int]$r2.pid -eq $pid1){throw 'owned EDUALC was not restarted'}
          if($j2.replaced_package_directories -contains 'EDUALC'){throw 'unchanged EDUALC payload unnecessarily replaced'}
          foreach($d in @('CORE','CONFIG','APPS','POLICY','COMPONENTS','TOOLS','ADDONS','UPDATES')){if(!(Test-Path (Join-Path $j2.backup_root $d))){throw "rollback backup missing $d"}}
          Write-Host "REINSTALL_PASS pid1=$pid1 pid2=$($r2.pid) backup=$($j2.backup_root)"
          python (Join-Path $dest 'CORE\verify_local_edualc.py') --root $dest;if($LASTEXITCODE -ne 0){throw 'second inference failed'}
          Write-Host 'SECOND_INFERENCE_PASS'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $dest 'CORE\stop_local_edualc_windows.ps1') -Root $dest
          Write-Host "WINDOWS_R4_LIFECYCLE_PASS pid1=$pid1 pid2=$($r2.pid) desktop=$($j2.desktop_launcher)"
